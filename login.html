<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock · Connexion</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#EEF2EF;--panel:#fff;--ink:#10211F;--mut:#5E716E;--line:#D9E2DE;--brand:#0F3D3A;--brand-ink:#fff;--mango:#F5A623;--red:#C93C3C;--shadow:0 1px 2px rgba(16,33,31,.06),0 8px 24px -12px rgba(16,33,31,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1514;--panel:#122220;--ink:#E8F0ED;--mut:#8DA29E;--line:#1F3431;--brand:#1D6B64;--red:#E36A6A;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px;animation:arrive .35s ease-out both}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:42px;height:42px;border-radius:12px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
p.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.gbtn:hover{border-color:var(--mango)}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
button.primary{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
.switch{margin-top:14px;text-align:center;font-size:14px;color:var(--mut)}
.switch a{color:var(--ink);font-weight:600}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}
.msg.show{display:block}
.msg.error{background:rgba(201,60,60,.12);color:var(--red)}
.msg.info{background:rgba(245,166,35,.16)}
.note{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.45}
</style></head><body>
<div class="card">
 <div class="brand"><img src="/icon.svg" alt=""><div><h1 id="title">Connexion</h1><p class="sub">Chaque boutique a son propre stock, ses alertes et ses appareils.</p></div></div>

 <a class="gbtn" id="google" href="/api/auth/google">
  <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.3 5.3C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
  Continuer avec Google
 </a>
 <div class="or">ou avec un email</div>

 <form id="form" novalidate>
  <div id="shop-field" hidden>
   <label for="shop_name">Nom de la boutique</label>
   <input id="shop_name" name="shop_name" autocomplete="organization" placeholder="Ma boutique">
  </div>
  <label for="email">Adresse email</label>
  <input id="email" name="email" type="email" autocomplete="email" required placeholder="vous@exemple.com">
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6 caractères minimum">
  <button class="primary" id="submit" type="submit">Se connecter</button>
 </form>

 <div class="msg" id="msg" role="alert"></div>
 <p class="switch" id="switch">Pas encore de compte ? <a href="#" id="mode">Créer une boutique</a></p>
 <p class="note">Le téléphone utilise le même compte : connectez-vous une fois sur le téléphone, il restera connecté 30 jours.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const errors={
 'google-non-configure':'La connexion Google n’est pas encore configurée sur le serveur (GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET).',
 'google-refuse':'Connexion Google annulée.',
 'google-echec':'La connexion Google a échoué. Réessayez.'
};
let register=false;
function setMode(value){
 register=value;
 $('title').textContent=register?'Créer un compte':'Connexion';
 $('submit').textContent=register?'Créer ma boutique':'Se connecter';
 $('shop-field').hidden=!register;
 $('switch').innerHTML=register?'Déjà un compte ? <a href="#" id="mode">Se connecter</a>':'Pas encore de compte ? <a href="#" id="mode">Créer une boutique</a>';
 $('mode').addEventListener('click',event=>{event.preventDefault();setMode(!register)});
 $('password').autocomplete=register?'new-password':'current-password';
}
setMode(false);
$('mode').addEventListener('click',event=>{event.preventDefault();setMode(true)});
if(params.get('error')){const m=$('msg');m.className='msg error show';m.textContent=errors[params.get('error')]||'Connexion impossible.'}
fetch('/api/auth/google-config').then(r=>r.json()).then(config=>{
 if(!config.enabled){const g=$('google');g.setAttribute('aria-disabled','true');g.title='Configurez GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET sur le serveur.';g.addEventListener('click',event=>{event.preventDefault();const m=$('msg');m.className='msg info show';m.textContent='La connexion Google n’est pas configurée. Utilisez un email pour l’instant.'})}
}).catch(()=>{});
$('form').addEventListener('submit',async event=>{
 event.preventDefault();
 const button=$('submit');button.disabled=true;
 const body={email:$('email').value.trim(),password:$('password').value,shop_name:$('shop_name').value.trim()};
 try{
  const response=await fetch(register?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||'Connexion impossible.');
  location.href='/';
 }catch(error){
  const m=$('msg');m.className='msg error show';m.textContent=error.message;
 }finally{button.disabled=false}
});
</script></body></html>
